    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #233d4d !important;
        }

        .font-gloria {
            font-family: 'Gloria Hallelujah';
        }

        #main-title {
            /* Verhindert das Ruckeln der Schrift beim Skalieren */
            will-change: font-size, padding;
        }

        .text-xxs {
            /* Setzt die Schriftgröße auf 0.625rem (ca. 10px), was kleiner als text-xs (12px) ist */
            font-size: 0.625rem; 
            line-height: 0.75rem; /* Optional: Stellt eine passende Zeilenhöhe ein */
        }
        .orange-semi-circle {
            background: linear-gradient(
                to bottom,        /* Startet oben und verläuft nach unten */
                #ff9d47,          /* Helleres Orange (oben) */
                #fe7f2d,     /* Dein Original-Orange (#fe7f2d) startet bei 60% */
                #99440b           /* Dunkleres Orange (unten) */
            );
            
            /* NEU: Größere Höhe und relative Breite, um mehr Präsenz zu haben */
            height: 100vh;  /* Fast die gesamte Viewport-Höhe */
            width: 20vw;  /* Die Breite basiert nur auf 30% der Viewport-Breite */
            
            /* Radius muss gleich der Breite sein (30vw) */
            border-top-left-radius: 30vw;
            border-bottom-left-radius: 30vw; 
            
            /* Positionierung */
            position: fixed; 
            right: 0;
            top: 50%; /* Vertikal zentrieren */
            transform: translateY(-50%); 
            z-index: 0; /* Im Hintergrund */
            opacity: 0.80; 
            pointer-events: none;
        }

        .no-scroll {
            overflow: hidden; /* Verhindert das Scrollen von Inhalten, die über den Viewport hinausragen */
            touch-action: none; /* WICHTIG: Deaktiviert alle standardmäßigen Touch-Gesten (wie vertikales Scrollen) */
        }

        .touch-action-none {
            /* WICHTIG: Überschreibt Standard-Gesten (long press, double tap) 
            und erzwingt das Feuern von Pointer Events */
            touch-action: none !important;
        }

        .touch-action-pan-y {
            touch-action: pan-y !important;
        }

        .modal-sheet * {
            /* Deaktiviert die Markierung von Text innerhalb des Modal sheets */
            -webkit-user-select: none;  /* Für Safari/Chrome */
            -moz-user-select: none;     /* Für Firefox */
            -ms-user-select: none;      /* Für IE/Edge */
            user-select: none;
        }

        .scrolled-header {
            /* 🔥 KORREKTUR: Hintergrundfarbe auf 1.0 (blickdicht) setzen, um Karten VOLLSTÄNDIG zu verdecken */
            background-color: rgb(35, 61, 77); /* Volle Opazität! */
            
            /* Blur und Webkit-Blur bleiben erhalten */
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
        }

        @keyframes voice-pill {
            0%, 100% { height: 4px; }
            50% { height: 16px; }
        }

        .animate-voice-pill {
            animation: voice-pill 0.6s ease-in-out infinite;
        }

        .input-error {
            border: 2px solid #ef4444 !important;
            color: #ef4444 !important;
        }
        .input-error::placeholder {
            color: #ef4444;
        }
        
    </style>
</head>

    <script>
        const API_BASE_URL = "https://indextest-ogpo.onrender.com";
        const statusText = document.getElementById('status-text');
        const recordButton = document.getElementById('record-button');
        const resultText = document.getElementById('result-text');
        const base64Size = document.getElementById('base64-size');
        const statusContainer = document.getElementById('status-container');
        const fabButton = document.getElementById('fab-button'); 
        const bottomSheet = document.getElementById("bottom-sheet");

        const input = document.getElementById("unified-todo-input");

        const stickyHeader = document.getElementById('sticky-header');
        const title = document.getElementById('main-title');
        const border = document.getElementById('header-border');
        const headerBackground = document.getElementById('full-width-bg');
        const scrollThreshold = 40;
        const photoButton = document.getElementById('photo-button');
        const hiddenPhotoInput = document.getElementById('hidden-photo-input');
        const photoPreviewContainer = document.getElementById('photo-preview-container');
        const photoPreview = document.getElementById('photo-preview');

        let mediaRecorder;
        let audioChunks = [];
        let stream;
        let isRecording = false; 
        let isSorting = false; // Diese Variable blockiert das Neuladen während des Schiebens
        let currentFiles = []; // Speichert die Blobs der aufgenommenen Bilder vor dem Speichern               
        let currentTaskData = { text: "", images: [] }; // Globaler Speicher für die aktuell gewählte Karte
        let isSending = false; 


        const menuFab = document.getElementById('menu-fab-button');
        const menuOptions = document.getElementById('fab-menu-options');
        const menuIcon = document.getElementById('menu-icon');
        const btnClearList = document.getElementById('btn-clear-list');
        const customConfirm = document.getElementById('custom-confirm');
        const confirmDeleteBtn = document.getElementById('confirm-delete');
        const confirmCancelBtn = document.getElementById('confirm-cancel');
        let isMenuOpen = false;

        // --- Supabase Setup ---
        const SUPABASE_URL = 'https://qpwjshkjlmzdmwfvzqqs.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFwd2pzaGtqbG16ZG13ZnZ6cXFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc0MzQ1NTAsImV4cCI6MjA4MzAxMDU1MH0.7kCRh4HGKleV5caomzw4zcdd91E1gnDjf2DbU3AQlBU';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Diese Funktion ersetzt dein bisheriges lokales Erstellen
        async function fetchTodos() {
            // Der "v" Parameter ist ein Trick: Er macht die URL für den Browser jedes Mal 
            // "neu", sodass er nicht aus dem Cache laden kann.
            const { data, error } = await supabaseClient
                .from('todos')
                .select('*')
                .order('position', { ascending: true });

            if (error) {
                console.error("Fehler:", error);
                return;
            }

            // Radikales Leeren der Liste
            todoList.innerHTML = "";

            if (data) {
                // Falls du am Desktop/Laptop testest, siehst du hier die Wahrheit:
                console.table(data.map(d => ({text: d.text, pos: d.position})));
                
                data.forEach(todo => {
                    createTodoCard(todo.text, todo.id, todo.created_at, todo.image_url);
                });
            }
        }

        let fetchTimeout;
        const todoSubscription = supabaseClient
            .channel('public:todos')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'todos' }, (payload) => {
                if (!isSorting) {
                    // Wenn eine Änderung kommt, warten wir 500ms. 
                    // Wenn in der Zeit eine weitere Änderung kommt, wird der Timer zurückgesetzt.
                    clearTimeout(fetchTimeout);
                    fetchTimeout = setTimeout(() => {
                        console.log("Synchronisiere Liste nach DB-Änderung...");
                        fetchTodos();
                    }, 500); 
                }
            })
            .subscribe();


        // NEU: Diese Funktion schreibt die aktuelle Reihenfolge in die Cloud
        async function updateOrderInDatabase() {
            isSorting = true; 
            const items = [...todoList.querySelectorAll('.swipe-wrapper')];            
            
            // Wir erstellen ein Array mit allen Objekten, die aktualisiert werden müssen
            const updates = items.map((item, index) => ({
                id: item.getAttribute('data-db-id'),
                position: index,
                // Falls deine Tabelle noch andere Pflichtfelder hat, müssen die hier nicht rein, 
                // da wir nur existierende IDs updaten.
            }));

            // "upsert" macht alles in EINER Anfrage
            const { error } = await supabaseClient
                .from('todos')
                .upsert(updates, { onConflict: 'id' }); 

            if (error) {
                console.error("Fehler beim Speichern der Reihenfolge:", error);
            } else {
                console.log("Reihenfolge erfolgreich in einem Rutsch gespeichert!");
            }

            // Wichtig: Etwas länger warten, bis sich der Realtime-Sturm gelegt hat
            setTimeout(() => {
                isSorting = false;
            }, 1500);
        }

        function triggerHaptic(style = 'light') {
            // Sicherstellen, dass navigator existiert und vibrate eine Funktion ist
            if (typeof navigator !== 'undefined' && typeof navigator.vibrate === 'function') {
                try {
                    if (style === 'light') navigator.vibrate(10);
                    else if (style === 'medium') navigator.vibrate(30);
                    else if (style === 'success') navigator.vibrate([20, 30, 20]);
                } catch (e) {
                    // Falls der Browser es doch blockiert, passiert einfach nichts
                }
            }
        }
               
        menuFab.addEventListener('click', (e) => {
            e.stopPropagation();
            isMenuOpen = !isMenuOpen;

            if (isMenuOpen) {
                menuOptions.classList.remove('hidden');
                setTimeout(() => {
                    menuOptions.classList.remove('opacity-0', 'translate-y-4');
                    menuIcon.style.transform = 'rotate(90deg)';
                }, 10);
            } else {
                closeMenu();
            }
        });

        function closeMenu() {
            isMenuOpen = false;
            menuOptions.classList.add('opacity-0', 'translate-y-4');
            menuIcon.style.transform = 'rotate(0deg)';
            setTimeout(() => {
                if (!isMenuOpen) menuOptions.classList.add('hidden');
            }, 300);

        async function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_SIZE = 1200; // 1200px ist der "Sweet Spot" für Handys
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_SIZE) {
                                height *= MAX_SIZE / width;
                                width = MAX_SIZE;
                            }
                        } else {
                            if (height > MAX_SIZE) {
                                width *= MAX_SIZE / height;
                                height = MAX_SIZE;
                            }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        // Wir wandeln das Canvas in ein Blob um (JPEG, 70% Qualität)
                        canvas.toBlob((blob) => {
                            resolve(blob);
                        }, 'image/jpeg', 0.7);
                    };
                };
            });
        }

        function enableInteract(wrapper, card, id, imageUrlArray){
            const bg = wrapper.querySelector('.swipe-action-bg');
            const iconComplete = bg.querySelector(`#icon-complete-${id}`);
            const iconMail = bg.querySelector(`#icon-mail-${id}`);
            const iconDelete = bg.querySelector(`#icon-delete-${id}`);
            
            iconMail.style.pointerEvents = "auto";
            iconDelete.style.pointerEvents = "auto";
            
            let startX, startY, currentX = 0, intent = null;
            const SNAP_LEFT = -180; 
            const MAX_LEFT = -200;

            bg.style.display = "grid";
            bg.style.gridTemplateColumns = "2fr 1fr 1fr";

            // E-Mail Icon Klick
            iconMail.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                e.preventDefault();
                
                // Befüllt die Daten für den Button oben
                currentTaskData = {
                    text: card.querySelector('p').innerText.trim(),
                    images: (typeof imageUrlArray !== 'undefined') ? imageUrlArray : []
                };

                const emailSheet = document.getElementById('email-sheet');
                const container = document.getElementById('email-sheet-container');
                emailSheet.classList.remove('hidden');
                setTimeout(() => container.classList.remove('translate-y-full'), 10);

                card.style.transition = "0.3s ease";
                card.style.transform = "translateX(0)";
                setTimeout(() => { bg.style.opacity = 0; }, 300);
            });

            // Lösch Icon Klick
            iconDelete.addEventListener('pointerdown', async (e) => {
                e.stopPropagation();
                e.preventDefault();
                
                const { error } = await supabaseClient.from('todos').delete().eq('id', id);
                if (!error) {
                    wrapper.style.transition = "all 0.4s ease";
                    wrapper.style.transform = "translateX(-100%)";
                    wrapper.style.opacity = "0";
                    setTimeout(() => { wrapper.remove(); }, 400);
                }
            });

            // --- Swipe & Sortier Logik (Dein Original) ---
            const onMove = (e) => {
                const x = e.clientX || (e.touches && e.touches[0].clientX);
                const y = e.clientY || (e.touches && e.touches[0].clientY);
                if (!startX) return;
                const dx = x - startX;
                const dy = y - startY;

                if (!intent || intent === 'waiting') {
                    if (Math.abs(dx) > 10) intent = 'swipe';
                    else if (Math.abs(dy) > 10 && intent === 'sort') {} 
                    else return;
                }

                if (intent === 'swipe') {
                    currentX = Math.max(MAX_LEFT, Math.min(250, dx));
                    card.style.transform = `translateX(${currentX}px)`;
                    bg.style.opacity = 1;
                    bg.style.background = "linear-gradient(to right, #16a34a 0%, #16a34a 50%, #3b82f6 50%, #3b82f6 75%, #dc2626 75%, #dc2626 100%)";
                    if (currentX > 20) {
                        iconComplete.style.opacity = 1; iconMail.style.opacity = 0; iconDelete.style.opacity = 0;
                    } else if (currentX < -20) {
                        iconComplete.style.opacity = 0;
                        if (currentX < -140) { iconDelete.style.opacity = 1; iconMail.style.opacity = 0.3; } 
                        else { iconDelete.style.opacity = 0.3; iconMail.style.opacity = 1; }
                    }
                } else if (intent === 'sort') {
                    const rect = wrapper.getBoundingClientRect();
                    if (wrapper.style.position !== 'fixed') {
                        wrapper.style.width = `${rect.width}px`;
                        wrapper.style.position = 'fixed';
                        wrapper.style.zIndex = '1000';
                        card.classList.add("opacity-50", "scale-95");
                    }
                    wrapper.style.top = `${y - (rect.height / 2)}px`;
                    const target = [...todoList.children].find(sib => {
                        if (sib === wrapper) return false;
                        const r = sib.getBoundingClientRect();
                        return y < r.top + r.height / 2;
                    });
                    todoList.insertBefore(wrapper, target || null);
                }
            };

            const onUp = async () => {
                document.removeEventListener('pointermove', onMove);
                document.removeEventListener('pointerup', onUp);
                if (intent === 'swipe') {
                    card.style.transition = "0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28)";
                    if (currentX > 160) {
                        triggerHaptic('success'); 
                        card.style.transform = "translateX(600px)";
                        setTimeout(() => { handleSwipeAction(id, "complete"); }, 200);
                    } else if (currentX < -60) {
                        triggerHaptic('light');
                        card.style.transform = `translateX(${SNAP_LEFT}px)`;
                    } else {
                        card.style.transform = "translateX(0)";
                        setTimeout(() => { if (!intent) bg.style.opacity = 0; }, 300);
                    }
                } else if (intent === 'sort') {
                    triggerHaptic('light');
                    wrapper.style.cssText = "";
                    card.classList.remove("opacity-50", "scale-95");
                    await updateOrderInDatabase();
                }
                intent = null; startX = null;
            };

            card.addEventListener('pointerdown', (e) => {
                if (e.target.closest('.swipe-action-bg')) return;
                startX = e.clientX; startY = e.clientY;
                card.style.transition = "none";
                intent = e.target.closest('.drag-handle') ? 'sort' : 'waiting';
                document.addEventListener('pointermove', onMove);
                document.addEventListener('pointerup', onUp);
            });
        }

        // --- Audio Logik (Unverändert übernommen) ---
        async function transcribeAudio(base64Audio, mimeType) {
            input.value = "Verarbeitung läuft... ☕";
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 60000);
                const response = await fetch(API_BASE_URL + '/transcribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ audio_base64: base64Audio, mime_type: mimeType }),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                const data = await response.json();
                if (response.ok) { input.value = data.transcript; input.focus(); } 
                else { input.value = `[FEHLER] ${data.error || "Serverfehler"}`; }
            } catch (error) {
                input.value = error.name === 'AbortError' ? "[TIMEOUT]" : `[NETZWERKFEHLER] ${error.message}`;
            }
        }

        function startRecording(e) {
            if (isRecording || !stream) return;
            e.preventDefault(); 
            if (e.pointerId !== undefined) e.target.setPointerCapture(e.pointerId); 
            isRecording = true;
            recordButton.classList.add('recording-pulse');
            input.value = "🔥 Aufnahme läuft... ";
            mediaRecorder = new MediaRecorder(stream, { mimeType: preferredMimeType });
            audioChunks = [];
            mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
            mediaRecorder.onstop = () => {
                if (audioChunks.length === 0) return;
                const reader = new FileReader();
                reader.onloadend = () => transcribeAudio(reader.result.split(',')[1], mediaRecorder.mimeType);
                reader.readAsDataURL(new Blob(audioChunks, { type: mediaRecorder.mimeType }));
            };
            mediaRecorder.start();
        }

        function stopRecording(e) {
            if (!isRecording) return;
            isRecording = false; 
            recordButton.classList.remove('recording-pulse');
            if (e.pointerId !== undefined) e.target.releasePointerCapture(e.pointerId);
            if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
        }

        async function initRecorder() {
            try {
                fetch(API_BASE_URL + '/health').catch(() => {}); 
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                recordButton.disabled = false;
                recordButton.addEventListener('pointerdown', startRecording); 
                recordButton.addEventListener('pointerup', stopRecording); 
            } catch (err) {
                input.value = "⚠️ Mikrofon-Fehler!";
            }
        }

        window.onload = () => {
            initRecorder();
            fetchTodos();
        };


        // 🔥 PWA Service Worker Registrierung
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                // Wir registrieren den Worker mit dem Pfad, wo die Datei liegt
                navigator.serviceWorker.register('./service-worker.js', { scope: './' })
                    .then(function(registration) {
                        console.log('ServiceWorker registriert mit Scope: ', registration.scope);
                    }, function(err) {
                        console.log('ServiceWorker Registrierung fehlgeschlagen: ', err);
                    });
            });
        }

        // Sobald die App wieder sichtbar wird, erzwinge ein Neuladen
        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") {
                fetchTodos();
            }
        });


    </script>
