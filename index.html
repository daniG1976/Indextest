    <title>To Do</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #233d4d !important;
        }

        .font-gloria {
            font-family: 'Gloria Hallelujah';
        }

        #main-title {
            /* Verhindert das Ruckeln der Schrift beim Skalieren */
            will-change: font-size, padding;
        }

        .text-xxs {
            /* Setzt die Schriftgröße auf 0.625rem (ca. 10px), was kleiner als text-xs (12px) ist */
            font-size: 0.625rem; 
            line-height: 0.75rem; /* Optional: Stellt eine passende Zeilenhöhe ein */
        }
        .orange-semi-circle {
            background: linear-gradient(
                to bottom,        /* Startet oben und verläuft nach unten */
                #ff9d47,          /* Helleres Orange (oben) */
                #fe7f2d,     /* Dein Original-Orange (#fe7f2d) startet bei 60% */
                #99440b           /* Dunkleres Orange (unten) */
            );
            
            /* NEU: Größere Höhe und relative Breite, um mehr Präsenz zu haben */
            height: 100vh;  /* Fast die gesamte Viewport-Höhe */
            width: 20vw;  /* Die Breite basiert nur auf 30% der Viewport-Breite */
            
            /* Radius muss gleich der Breite sein (30vw) */
            border-top-left-radius: 30vw;
            border-bottom-left-radius: 30vw; 
            
            /* Positionierung */
            position: fixed; 
            right: 0;
            top: 50%; /* Vertikal zentrieren */
            transform: translateY(-50%); 
            z-index: 0; /* Im Hintergrund */
            opacity: 0.80; 
            pointer-events: none;
        }

        .no-scroll {
            overflow: hidden; /* Verhindert das Scrollen von Inhalten, die über den Viewport hinausragen */
            touch-action: none; /* WICHTIG: Deaktiviert alle standardmäßigen Touch-Gesten (wie vertikales Scrollen) */
        }

        .touch-action-none {
            /* WICHTIG: Überschreibt Standard-Gesten (long press, double tap) 
            und erzwingt das Feuern von Pointer Events */
            touch-action: none !important;
        }

        .touch-action-pan-y {
            touch-action: pan-y !important;
        }

        .modal-sheet * {
            /* Deaktiviert die Markierung von Text innerhalb des Modal sheets */
            -webkit-user-select: none;  /* Für Safari/Chrome */
            -moz-user-select: none;     /* Für Firefox */
            -ms-user-select: none;      /* Für IE/Edge */
            user-select: none;
        }

        .scrolled-header {
            /* 🔥 KORREKTUR: Hintergrundfarbe auf 1.0 (blickdicht) setzen, um Karten VOLLSTÄNDIG zu verdecken */
            background-color: rgb(35, 61, 77); /* Volle Opazität! */
            
            /* Blur und Webkit-Blur bleiben erhalten */
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
        }

        @keyframes voice-pill {
            0%, 100% { height: 4px; }
            50% { height: 16px; }
        }

        .animate-voice-pill {
            animation: voice-pill 0.6s ease-in-out infinite;
        }

        .input-error {
            border: 2px solid #ef4444 !important;
            color: #ef4444 !important;
        }
        .input-error::placeholder {
            color: #ef4444;
        }
        
    </style>
</head>

    <script>
        // *** Frontend-Logik: Aufnahme, Base64-Kodierung & Senden an Python-Backend ***
        
        // Konstanten für UI-Elemente
        const API_BASE_URL = "https://indextest-ogpo.onrender.com";
        const statusText = document.getElementById('status-text');
        const recordButton = document.getElementById('record-button');
        const resultText = document.getElementById('result-text');
        const base64Size = document.getElementById('base64-size');
        const statusContainer = document.getElementById('status-container');
        const fabButton = document.getElementById('fab-button'); 
        const bottomSheet = document.getElementById("bottom-sheet");
        const bottomSheetContainer = document.getElementById("bottom-sheet-container");
        const closeBottomSheetButton = document.getElementById("close-bottom-sheet-button");
        const input = document.getElementById("unified-todo-input");
        const saveButton = document.getElementById("save-unified-button");
        const todoList = document.getElementById("todo-list");
        const stickyHeader = document.getElementById('sticky-header');
        const title = document.getElementById('main-title');
        const border = document.getElementById('header-border');
        const headerBackground = document.getElementById('full-width-bg');
        const scrollThreshold = 40;

        let mediaRecorder;
        let audioChunks = [];
        let stream;
        let isRecording = false; 

        const menuFab = document.getElementById('menu-fab-button');
        const menuOptions = document.getElementById('fab-menu-options');
        const menuIcon = document.getElementById('menu-icon');
        const btnClearList = document.getElementById('btn-clear-list');
        const customConfirm = document.getElementById('custom-confirm');
        const confirmDeleteBtn = document.getElementById('confirm-delete');
        const confirmCancelBtn = document.getElementById('confirm-cancel');
        let isMenuOpen = false;

        function triggerHaptic(style = 'light') {
            // Sicherstellen, dass navigator existiert und vibrate eine Funktion ist
            if (typeof navigator !== 'undefined' && typeof navigator.vibrate === 'function') {
                try {
                    if (style === 'light') navigator.vibrate(10);
                    else if (style === 'medium') navigator.vibrate(30);
                    else if (style === 'success') navigator.vibrate([20, 30, 20]);
                } catch (e) {
                    // Falls der Browser es doch blockiert, passiert einfach nichts
                }
            }
        }
        
        
        menuFab.addEventListener('click', (e) => {
            e.stopPropagation();
            isMenuOpen = !isMenuOpen;

            if (isMenuOpen) {
                menuOptions.classList.remove('hidden');
                setTimeout(() => {
                    menuOptions.classList.remove('opacity-0', 'translate-y-4');
                    menuIcon.style.transform = 'rotate(90deg)';
                }, 10);
            } else {
                closeMenu();
            }
        });

        function closeMenu() {
            isMenuOpen = false;
            menuOptions.classList.add('opacity-0', 'translate-y-4');
            menuIcon.style.transform = 'rotate(0deg)';
            setTimeout(() => {
                if (!isMenuOpen) menuOptions.classList.add('hidden');
            }, 300);
        }

        document.addEventListener('click', (e) => {
            if (isMenuOpen && !menuFab.contains(e.target) && !menuOptions.contains(e.target)) {
                closeMenu();
            }
        });

        // Die "Liste leeren" Funktion umschreiben:
        btnClearList.addEventListener('click', () => {
            closeMenu(); // Erst das kleine Menü zu
            customConfirm.classList.remove('hidden'); // Dann die große Abfrage auf
        });

        // Wenn man auf Löschen klickt:
        confirmDeleteBtn.addEventListener('click', () => {
            const cards = todoList.querySelectorAll('.swipe-wrapper');
            cards.forEach((card, index) => {
                setTimeout(() => {
                    card.style.transition = "all 0.4s ease";
                    card.style.transform = "translateX(100%)";
                    card.style.opacity = "0";
                    setTimeout(() => card.remove(), 400);
                }, index * 50);
            });
            customConfirm.classList.add('hidden');
        });

        // Wenn man auf Abbrechen klickt:
        confirmCancelBtn.addEventListener('click', () => {
            customConfirm.classList.add('hidden');
        });

        const btnReadAloud = document.getElementById('btn-read-aloud');
        const readAloudText = btnReadAloud.querySelector('span');
        const readAloudIconDiv = btnReadAloud.querySelector('.bg-purple-500');
        const voicePlayer = document.getElementById('voice-player');
        const btnVoiceStop = document.getElementById('btn-voice-stop');

                // Stopp-Funktion für den Player
        btnVoiceStop.addEventListener('click', () => {
            window.speechSynthesis.cancel();
            voicePlayer.classList.add('hidden');
        });

        btnReadAloud.addEventListener('click', () => {
            closeMenu();
            const todos = [...todoList.querySelectorAll('.todo-card p')].map(p => p.innerText);
            let textToRead = "";

            if (todos.length === 0) {
                textToRead = "Nichts zum Vorlesen da, du Dödel!";
            } else {
                textToRead = "Deine Aufgaben sind: " + todos.join(". ");
                // Player anzeigen, wenn Aufgaben da sind
                voicePlayer.classList.remove('hidden');
            }

            const utterance = new SpeechSynthesisUtterance(textToRead);
            utterance.lang = 'de-DE';
            
            utterance.onend = () => {
                voicePlayer.classList.add('hidden');
            };

            window.speechSynthesis.speak(utterance);
        });

        const preferredMimeType = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : 'audio/webm';

        // Blockiert das Kontextmenü/Long-Press-Menü auf dem Button
        recordButton.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            e.stopPropagation();
        });

        function openBottomSheet() {
            bottomSheet.classList.remove("hidden");

            // erst runterholen
            bottomSheetContainer.classList.remove("translate-y-full");

            // Pop-Animation sauber resetten
            bottomSheetContainer.classList.remove("bottom-sheet-pop");
            void bottomSheetContainer.offsetWidth; 
            bottomSheetContainer.classList.add("bottom-sheet-pop");
        }

        fabButton.addEventListener("click", openBottomSheet);

        
        function closeBottomSheet() {
            bottomSheetContainer.classList.remove("bottom-sheet-pop");
            bottomSheetContainer.classList.add("translate-y-full");

            setTimeout(() => {
                bottomSheet.classList.add("hidden");
            }, 300);
        }

        closeBottomSheetButton.addEventListener("click", closeBottomSheet);

        saveButton.addEventListener("click", () => {
            const text = input.value.trim();
            if (!text) return;

            try {
                createTodoCard(text);
            } catch (e) {
                console.error("Fehler beim Erstellen der Karte:", e);
            } finally {
                // Das hier wird IMMER ausgeführt
                input.value = ""; 
                closeBottomSheet();
                if (document.activeElement) document.activeElement.blur();
            }
        });

        // --- KARTEN ERSTELLUNG ---
        function createTodoCard(text) {
            console.log("Karte wird erstellt für:", text);
            const id = Date.now(); 
            const wrapper = document.createElement("div");
            wrapper.id = `card-wrapper-${id}`;
            wrapper.className = "swipe-wrapper relative mb-3 bg-transparent";

            const now = new Date();
            const formattedDate = `${String(now.getDate()).padStart(2, '0')}.${String(now.getMonth() + 1).padStart(2, '0')}.${now.getFullYear()}`;

            const bg = document.createElement("div");
            bg.className = "swipe-action-bg absolute inset-0 rounded-2xl opacity-0 transition-opacity duration-200";
            bg.style.display = "grid";
            bg.style.gridTemplateColumns = "2fr 1fr 1fr"; // 50% | 25% | 25%
            bg.style.height = "100%"; 

            bg.innerHTML = `
                <div class="flex items-center h-full pl-8"> 
                    <div id="icon-complete-${id}" class="opacity-0 transition-opacity duration-200">
                        <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </div>
                </div>
                <div class="flex justify-center items-center h-full">
                    <div id="icon-mail-${id}" class="opacity-0 transition-opacity duration-200">
                        <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8m0 8H3V8a2 2 0 012-2h14a2 2 0 012 2v8z"/></svg>
                    </div>
                </div>
                <div class="flex justify-center items-center h-full">
                    <div id="icon-delete-${id}" class="opacity-0 transition-opacity duration-200">
                        <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M19 6v14H5V6h14zm-7-3h0a2 2 0 012 2v0H10V5a2 2 0 012-2z"/></svg>
                    </div>
                </div>
            `;

            const card = document.createElement("div");
            card.id = `card-${id}`;
            card.className = "todo-card h-auto bg-gradient-to-r from-[#233d4d]/20 to-[#fe7f2d]/90 backdrop-blur-xl text-[#fe7f2d] rounded-2xl p-3 shadow-md relative z-10 touch-action-none";
            card.innerHTML = `
                <div class="flex flex-col h-full justify-between pointer-events-none">
                    <div class="flex justify-between items-start">
                        <p class="text-lg font-semibold leading-tight pr-4">${text}</p>
                        <span class="drag-handle text-[#233d4d] text-xl opacity-80 px-2 pointer-events-auto" style="cursor: grab; margin-top: -4px;">☰</span>
                    </div>
                    <div style="margin-top: -2px;"><span class="text-[9px] opacity-60 font-mono tracking-tighter">${formattedDate}</span></div>
                </div>
            `;

            wrapper.appendChild(bg);
            wrapper.appendChild(card);
            todoList.appendChild(wrapper);

            enableInteract(wrapper, card, id);
        }     

        window.addEventListener('scroll', () => {
            const headerBg = document.getElementById('header-bg');
            const title = document.getElementById('main-title');
            
            if (window.scrollY > 20) {
                // ZUSTAND: GESCROLLT (Glaseffekt)
                // Wir nehmen ein transparentes Blau-Grau als Basis
                headerBg.style.backgroundColor = 'rgba(35, 61, 77, 0.75)'; 
                headerBg.style.backdropFilter = 'blur(15px)';
                headerBg.style.webkitBackdropFilter = 'blur(15px)'; // WICHTIG FÜR IPHONE
                
                title.classList.replace('text-5xl', 'text-2xl');
                title.classList.replace('py-6', 'py-3');
            } else {
                // ZUSTAND: GANZ OBEN (Alles durchsichtig)
                headerBg.style.backgroundColor = 'transparent';
                headerBg.style.backdropFilter = 'none';
                headerBg.style.webkitBackdropFilter = 'none';
                
                title.classList.replace('text-2xl', 'text-5xl');
                title.classList.replace('py-3', 'py-6');
            }
        });        

        function handleSwipeAction(id, action) {
            const wrapper = document.getElementById(`card-wrapper-${id}`);
            if (!wrapper) return;
            wrapper.style.transition = "all 0.3s ease";
            wrapper.style.height = "0";
            wrapper.style.marginBottom = "0";
            wrapper.style.opacity = "0";
            wrapper.style.transform = "scale(0.9)";
            setTimeout(() => { wrapper.remove(); }, 300);
        }

        function enableInteract(wrapper, card, id) {
            const bg = wrapper.querySelector('.swipe-action-bg');
            const iconComplete = bg.querySelector(`#icon-complete-${id}`);
            const iconMail = bg.querySelector(`#icon-mail-${id}`);
            const iconDelete = bg.querySelector(`#icon-delete-${id}`);
            
            let startX, startY, currentX = 0, intent = null;
            
            // Werte für iPhone optimiert
            const SNAP_LEFT = -180; 
            const MAX_LEFT = -200; // Strengere Begrenzung gegen "Grün-Blitzen"

            bg.style.display = "grid";
            bg.style.gridTemplateColumns = "2fr 1fr 1fr";
            bg.style.alignItems = "center";

            const onMove = (e) => {
                const x = e.clientX || (e.touches && e.touches[0].clientX);
                const y = e.clientY || (e.touches && e.touches[0].clientY);
                if (!startX) return;

                const dx = x - startX;
                const dy = y - startY;

                // Logik: Was will der Nutzer tun?
                if (!intent || intent === 'waiting') {
                    // 1. Wenn horizontal bewegt wird -> Immer Swipe
                    if (Math.abs(dx) > 10) {
                        intent = 'swipe';
                    } 
                    // 2. Wenn vertikal bewegt wird -> NUR sortieren, wenn im pointerdown 'sort' gesetzt wurde
                    else if (Math.abs(dy) > 10) {
                        if (intent === 'sort') {
                            // Alles okay, sortieren läuft weiter
                        } else {
                            // Nutzer bewegt vertikal, hat aber nicht das Handle angefasst
                            // Wir tun nichts und lassen das System evtl. normal scrollen
                            return; 
                        }
                    } else {
                        return; // Noch nicht genug Bewegung
                    }
                }

                // --- SWIPE LOGIK ---
                if (intent === 'swipe') {
                    currentX = Math.max(MAX_LEFT, Math.min(250, dx));
                    card.style.transform = `translateX(${currentX}px)`;
                    bg.style.opacity = 1;
                    bg.style.background = "linear-gradient(to right, #16a34a 0%, #16a34a 50%, #3b82f6 50%, #3b82f6 75%, #dc2626 75%, #dc2626 100%)";

                    if (currentX > 20) {
                        iconComplete.style.opacity = 1;
                        iconMail.style.opacity = 0;
                        iconDelete.style.opacity = 0;
                    } else if (currentX < -20) {
                        iconComplete.style.opacity = 0;
                        if (currentX < -140) { 
                            iconDelete.style.opacity = 1; iconMail.style.opacity = 0.3;
                        } else {
                            iconDelete.style.opacity = 0.3; iconMail.style.opacity = 1;
                        }
                    }
                } 
                // --- SORTIER LOGIK ---
                else if (intent === 'sort') {
                    const rect = wrapper.getBoundingClientRect();
                    if (wrapper.style.position !== 'fixed') {
                        wrapper.style.width = `${rect.width}px`;
                        wrapper.style.position = 'fixed';
                        wrapper.style.zIndex = '1000';
                        card.classList.add("opacity-50", "scale-95");
                    }
                    wrapper.style.top = `${y - (rect.height / 2)}px`;
                    const target = [...todoList.children].find(sib => {
                        if (sib === wrapper) return false;
                        const r = sib.getBoundingClientRect();
                        return y < r.top + r.height / 2;
                    });
                    todoList.insertBefore(wrapper, target || null);
                }
            };

            const onUp = () => {
                document.removeEventListener('pointermove', onMove);
                document.removeEventListener('pointerup', onUp);

                if (intent === 'swipe') {
                    card.style.transition = "0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28)";

                    // FALL 1: Karte nach rechts wischen (Erledigt)
                    if (currentX > 160) {
                        triggerHaptic('success'); 
                        card.style.transform = "translateX(600px)";
                        
                        // Sicherer Aufruf der Lösch-Funktion
                        setTimeout(() => {
                            if (typeof handleSwipeAction === "function") {
                                handleSwipeAction(id, "complete");
                            } else {
                                // Notfall-Löschen, falls die Funktion oben nicht gefunden wird
                                wrapper.remove();
                            }
                        }, 200);
                    }
                    
                    // FALL 2: Karte nach links wischen (Snap für Mail/Löschen)
                    else if (currentX < -60) {
                        triggerHaptic('light'); // ⚡ Kurzer "Klick", wenn sie einrastet
                        card.style.transform = `translateX(${SNAP_LEFT}px)`;
                        iconMail.style.opacity = 1; 
                        iconDelete.style.opacity = 1;
                    } 
                    
                    // FALL 3: Zurück in die Mitte
                    else {
                        card.style.transform = "translateX(0)";
                        setTimeout(() => { if (!intent) bg.style.opacity = 0; }, 300);
                    }
                } else if (intent === 'sort') {
                    triggerHaptic('light'); // ✌️ Feedback beim Loslassen der sortierten Karte
                    wrapper.style.cssText = "";
                    card.classList.remove("opacity-50", "scale-95");
                }
                intent = null; startX = null;
            };

            card.addEventListener('pointerdown', (e) => {
                if (e.target.closest('.swipe-action-bg')) return;

                startX = e.clientX;
                startY = e.clientY;
                card.style.transition = "none";

                // Wir prüfen sofort: Wurde das Handle angefasst?
                const isHandle = e.target.closest('.drag-handle');
                
                if (isHandle) {
                    intent = 'sort'; // Explizit sortieren
                } else {
                    intent = 'waiting'; // Wir warten ab, ob es ein Swipe wird
                }
                
                document.addEventListener('pointermove', onMove);
                document.addEventListener('pointerup', onUp);
            });

            // 1. E-Mail Versand Logik
            let currentMailText = ""; // Merkt sich den Text der aktuellen Karte

            iconMail.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                e.preventDefault();
                
                currentMailText = card.querySelector('p').innerText.trim().replace(/\s+/g, ' ');
                
                // Sheet öffnen
                const emailSheet = document.getElementById('email-sheet');
                const container = document.getElementById('email-sheet-container');
                const emailInput = document.getElementById('recipient-email');

                // DIE NEUE ZEILE: Adresse aus dem Speicher holen (falls vorhanden)
                const savedEmail = localStorage.getItem('lastRecipient');
                if (savedEmail) {
                    emailInput.value = savedEmail;
                }
                emailSheet.classList.remove('hidden');
                setTimeout(() => container.classList.remove('translate-y-full'), 10);
                
                // Karte zurückschieben
                card.style.transform = "translateX(0)";
                setTimeout(() => { bg.style.opacity = 0; }, 300);
            });

            document.getElementById('cancel-email').addEventListener('click', closeEmailSheet);

            function closeEmailSheet() {
                const container = document.getElementById('email-sheet-container');
                container.classList.add('translate-y-full');
                setTimeout(() => document.getElementById('email-sheet').classList.add('hidden'), 300);
            }

            document.getElementById('send-email-confirm').addEventListener('click', () => {
                const emailInput = document.getElementById('recipient-email');
                const email = emailInput.value.trim();
                
                // Einfache Prüfung der E-Mail
                if (!email.includes('@') || email.length < 5) {
                    const originalPlaceholder = emailInput.placeholder;
                    const originalValue = emailInput.value;

                    emailInput.value = "";
                    emailInput.placeholder = "⚠️ Ungültige E-Mail Adresse!";
                    emailInput.classList.add('input-error');

                    // Nach 2 Sekunden alles zurücksetzen
                    setTimeout(() => {
                        emailInput.classList.remove('input-error');
                        emailInput.placeholder = originalPlaceholder;
                        emailInput.value = originalValue;
                    }, 2000);
                    return;
                }

                if (document.activeElement) document.activeElement.blur();

                const anim = document.getElementById('send-success-anim');
                anim.classList.remove('hidden');

                emailjs.send('service_p1o2ghl', 'template_bz12gsg', {
                    to_email: email, 
                    message: currentMailText,
                    subject: "Neue Aufgabe für dich 🚀"
                })
                .then(() => {
                    localStorage.setItem('lastRecipient', email);
                    setTimeout(() => {
                        anim.classList.add('hidden');
                        closeEmailSheet(); 
                    }, 1500);
                })
                .catch((err) => {
                    anim.classList.add('hidden');
                    emailInput.value = "";
                    emailInput.placeholder = "❌ Sende-Fehler!";
                    emailInput.classList.add('input-error');
                    setTimeout(() => emailInput.classList.remove('input-error'), 3000);
                });
            });

            // 2. Löschen Logik (Die Tonne)
            iconDelete.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                e.preventDefault();
                
                console.log("Löschen gedrückt");
                
                // Animation für das Löschen
                wrapper.style.transition = "all 0.4s ease";
                wrapper.style.transform = "translateX(-100%)";
                wrapper.style.opacity = "0";
                
                setTimeout(() => {
                    wrapper.remove();
                }, 400);
            });
        }

        async function transcribeAudio(base64Audio, mimeType) {
            // Besseres Feedback, falls der Server erst hochfahren muss
            input.value = "Verarbeitung läuft... (Das Backend wacht evtl. gerade auf ☕)";

            try {
                // Setze einen längeren Timeout für den ersten Request nach dem Sleep
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 60000); // 60 Sek Zeit geben

                const response = await fetch(API_BASE_URL + '/transcribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ audio_base64: base64Audio, mime_type: mimeType }),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);
                const data = await response.json();

                if (response.ok) {
                    input.value = data.transcript; 
                    input.focus(); 
                } else {
                    input.value = `[FEHLER] ${data.error || "Serverfehler"}`; 
                }
                
            } catch (error) {
                if (error.name === 'AbortError') {
                    input.value = "[TIMEOUT] Das Backend hat zu lange zum Aufwachen gebraucht. Bitte gleich noch mal versuchen!";
                } else {
                    input.value = `[NETZWERKFEHLER] ${error.message}`;
                }
            }
        }

        function startRecording(e) {
            // 1. Prüfe, ob wir schon aufnehmen oder ob es nicht der Record Button ist.
            if (isRecording) return;
            
            // 2. Wichtig: Verhindert, dass der Browser ein unnötiges Click-Event auslöst,
            //    aber wir müssen den Pointer Capture setzen.
            e.preventDefault(); 
            
            // 3. Wenn es ein Pointer-Event ist, Capture setzen.
            if (e.pointerId !== undefined) {
                // Stellt sicher, dass das pointerup-Event auch außerhalb des Buttons gefeuert wird.
                e.target.setPointerCapture(e.pointerId); 
            }
            
            if (!stream) {
                input.value = "[FEHLER] Mikrofon nicht bereit. Erlaubnis verweigert?";
                return;
            }
            
            isRecording = true;
            recordButton.classList.add('recording-pulse');
            input.value = "🔥 Aufnahme läuft... ";

            try {
                mediaRecorder = new MediaRecorder(stream, { mimeType: preferredMimeType });
            } catch (error) {
                input.value = `[FEHLER] MediaRecorder konnte nicht initialisiert werden: ${error.message}`;
                isRecording = false;
                recordButton.classList.remove('recording-pulse');
                return;
            }

            audioChunks = [];
            
            mediaRecorder.ondataavailable = event => {
                audioChunks.push(event.data);
            };

            mediaRecorder.onstop = () => {
                if (audioChunks.length === 0) {
                    input.value = "[HINWEIS] Aufnahme zu kurz oder keine Daten erfasst.";
                    return;
                }

                const mimeType = mediaRecorder.mimeType;
                const audioBlob = new Blob(audioChunks, { type: mimeType });
                const reader = new FileReader();
                
                reader.onloadend = () => {
                    const base64Audio = reader.result.split(',')[1];
                    transcribeAudio(base64Audio, mimeType);
                };
                reader.readAsDataURL(audioBlob);
            };

            mediaRecorder.start();
            console.log("Aufnahme gestartet...");
        }

        function stopRecording(e) {
            if (!isRecording) return;
            
            isRecording = false; 
            recordButton.classList.remove('recording-pulse');

            // Wenn Pointer Capture gesetzt wurde, muss es freigegeben werden.
            if (e.pointerId !== undefined) {
                e.target.releasePointerCapture(e.pointerId);
            }
            
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                console.log("Aufnahme gestoppt. Starte Transkription...");
            }
        }

        async function wakeUpBackend() {
            console.log("Wecke Backend auf...");
            try {
                // Wir senden einen einfachen GET-Request an eine (evtl. neue) Health-Route 
                // oder einfach an dein Haupt-URL. 
                // Auch wenn es ein 404 gibt, wacht Render trotzdem auf!
                fetch(API_BASE_URL + '/health').catch(() => {}); 
                
                // Alternativ: Ein leerer POST an /transcribe (würde einen Fehler werfen, weckt aber auch)
            } catch (e) {
                // Fehler ignorieren, es geht nur um den Ping
            }
        }

        async function initRecorder() {
            wakeUpBackend();
            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                console.log(`Mikrofon bereit. Format: ${preferredMimeType}`);
                recordButton.disabled = false;
                
                // 🔥 WICHTIG: pointerdown/pointerup verwenden, aber nur auf dem Button lauschen
                recordButton.addEventListener('pointerdown', startRecording); 
                recordButton.addEventListener('pointerup', stopRecording); 
                
                // Fügt das stop-Event zum Dokument hinzu, falls der Benutzer außerhalb loslässt (Desktop).
                // ACHTUNG: Wir nutzen hier KEIN pointerup, da wir setPointerCapture verwenden,
                // was das pointerup an den Button zurücksendet, auch wenn außerhalb losgelassen wird.
                // Das document-level stopRecording (wie in der vorherigen Version) ist hier nicht mehr nötig.

            } catch (err) {
                console.error("Fehler beim Zugriff auf das Mikrofon: ", err);
                input.value = "⚠️ Fehler: Mikrofonberechtigung verweigert oder Gerät nicht gefunden.";
                recordButton.disabled = true;
            }
        }
        window.onload = initRecorder;

        // 🔥 PWA Service Worker Registrierung
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                // Wir registrieren den Worker mit dem Pfad, wo die Datei liegt
                navigator.serviceWorker.register('./service-worker.js', { scope: './' })
                    .then(function(registration) {
                        console.log('ServiceWorker registriert mit Scope: ', registration.scope);
                    }, function(err) {
                        console.log('ServiceWorker Registrierung fehlgeschlagen: ', err);
                    });
            });
        }


    </script>

            0%   { transform: translateY(100%) scale(0.95); }

        }
        .bottom-sheet-pop {
            animation: bottomSheetPop 300ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .todo-card {
            user-select: none;
        }
